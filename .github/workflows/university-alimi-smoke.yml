name: INJE university Alimi API smoke
on:
  pull_request:
    paths:
      - 'v2/universityAlimiApi.js'
      - 'v2/steps/universityAlimiPanel.js'
      - 'supabase/functions/univ-alimi-faculty-pilot/index.ts'
      - '.github/workflows/university-alimi-smoke.yml'
  workflow_dispatch:
jobs:
  faculty-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify faculty API response for multiple years
        run: |
          node --input-type=module <<'JS'
          let found=false;
          for(const [year,kind] of [['2025','ensure'],['2026','ensure'],['2025','research'],['2026','research']]){
            const u=new URL('https://hllnoriffbhzpyhpnvsf.supabase.co/functions/v1/univ-alimi-faculty-pilot');
            u.searchParams.set('school','인제대학교');
            u.searchParams.set('year',year);
            u.searchParams.set('kind',kind);
            try{
              const r=await fetch(u,{signal:AbortSignal.timeout(18000)});
              const x=await r.json();
              console.log(JSON.stringify({
                year,kind,http:r.status,ok:x?.ok===true,error:x?.error||null,
                gatewayCode:x?.gatewayCode||null,xmlRoot:x?.xmlRoot||null,
                tagNames:x?.tagNames||null,received:x?.received??null,
                rowCount:Array.isArray(x?.rows)?x.rows.length:null
              },null,2));
              if(r.ok&&x?.ok===true&&Array.isArray(x?.rows)&&x.rows.length)found=true;
            }catch(e){console.error('University gateway unavailable:',e?.name||'request error');}
          }
          if(!found)process.exitCode=1;
          JS
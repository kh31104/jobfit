name: INJE cross-browser mobile and Pages verification

on:
  pull_request:
    paths:
      - 'index.html'
      - 'v2/**'
      - '.github/workflows/inje-mobile-browser.yml'
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'v2/**'
      - '.github/workflows/inje-mobile-browser.yml'

permissions:
  contents: read
  statuses: write

jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and both mobile browser engines
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Start isolated local server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/jobfit-mobile-server.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:8765/ >/dev/null
      - name: Test student root URL on iPhone Safari WebKit and Android Chrome
        env:
          JOBFIT_TEST_URL: http://127.0.0.1:8765/
        run: node v2/tests/inje-mobile-cross-browser.mjs
      - name: Test v2 URL on iPhone Safari WebKit and Android Chrome
        env:
          JOBFIT_TEST_URL: http://127.0.0.1:8765/v2/
        run: node v2/tests/inje-mobile-cross-browser.mjs
      - name: Print local server errors if failed
        if: failure()
        run: cat /tmp/jobfit-mobile-server.log || true

  deployed-mobile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: mobile-browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm the fixed bundle is served on GitHub Pages
        run: node v2/tests/inje-live-deployment.mjs
      - name: Install Playwright and both mobile browser engines
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Exercise deployed student root on mobile browser engines
        env:
          JOBFIT_TEST_URL: https://kh31104.github.io/jobfit/
        run: node v2/tests/inje-mobile-cross-browser.mjs
      - name: Exercise deployed v2 on mobile browser engines
        env:
          JOBFIT_TEST_URL: https://kh31104.github.io/jobfit/v2/
        run: node v2/tests/inje-mobile-cross-browser.mjs
      - name: Record production iOS Android verification on commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_OUTCOME: ${{ job.status }}
        shell: bash
        run: |
          set -e
          state=failure
          description="Deployed Pages or mobile browser verification failed"
          if [ "$VALIDATION_OUTCOME" = "success" ]; then
            state=success
            description="Pages bundle and mobile WebKit/Chromium tests passed"
          fi
          export JOBFIT_STATE="$state" JOBFIT_DESCRIPTION="$description"
          python3 - <<'PY' > /tmp/jobfit-mobile-status.json
          import json,os
          print(json.dumps({
            "state":os.environ["JOBFIT_STATE"],
            "context":"jobfit/live-mobile-verified",
            "description":os.environ["JOBFIT_DESCRIPTION"],
            "target_url":"https://github.com/"+os.environ["GITHUB_REPOSITORY"]+"/actions"
          }))
          PY
          curl --fail --show-error --silent --retry 3             -X POST             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             -H "Content-Type: application/json"             --data-binary @/tmp/jobfit-mobile-status.json             "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null

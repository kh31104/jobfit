name: Dong-A Career DNA checks
on:
  pull_request:
    paths:
      - 'donga/**'
      - '.github/workflows/donga-checks.yml'
  push:
    branches: [main]
    paths:
      - 'donga/**'
      - '.github/workflows/donga-checks.yml'
permissions:
  contents: read
jobs:
  syntax-and-contracts:
    name: syntax-and-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check donga/app.js
      - run: node --check donga/step2/app.js
      - run: node donga/tests/smoke.mjs
      - run: node --check donga/reset-controls.js
      - run: node donga/tests/reset-controls.mjs
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node donga/tests/smoke.mjs
  browser-regression:
    name: browser-regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mobile browser engines
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Start local app server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/jobfit-donga-server.log 2>&1 &
          sleep 2
      - name: Test Android Chrome and iPhone Safari
        env:
          JOBFIT_TEST_URL: http://127.0.0.1:8765/donga/
        run: node donga/tests/browser.mjs
      - name: Test DONG-A STEP 2 PC Chrome end-to-end
        env:
          JOBFIT_STEP2_URL: http://127.0.0.1:8765/donga/step2/
        run: node donga/step2/tests/browser.mjs
      - name: Test DONG-A STEP 3 PDF and Android/iPhone browsers
        env:
          JOBFIT_STEP3_URL: http://127.0.0.1:8765/donga/step3/
        run: node donga/step3/tests/browser.mjs

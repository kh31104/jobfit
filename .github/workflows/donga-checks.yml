name: Dong-A Career DNA checks
on:
  pull_request:
    paths:
      - 'donga/**'
      - '.github/workflows/donga-checks.yml'
  push:
    branches: [main]
    paths:
      - 'donga/**'
      - '.github/workflows/donga-checks.yml'
permissions:
  contents: read
jobs:
  syntax-and-contracts:
    name: syntax-and-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check donga/app.js
      - run: node donga/tests/smoke.mjs
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node donga/tests/smoke.mjs
  browser-regression:
    name: browser-regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mobile browser engines
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Start local app server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/jobfit-donga-server.log 2>&1 &
          sleep 2
      - name: Test Android Chrome and iPhone Safari
        env:
          JOBFIT_TEST_URL: http://127.0.0.1:8765/donga/
        run: node donga/tests/browser.mjs

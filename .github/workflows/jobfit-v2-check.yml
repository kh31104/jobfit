name: Jobfit regression checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'v2/**'
      - 'instructor/**'
      - 'research-sync-config.js'
      - 'supabase/**'
      - 'docs/JOBFIT_DEVELOPMENT_RULES.md'
      - 'docs/JOBFIT_RELEASE_GATE.md'
      - '.github/workflows/jobfit-v2-check.yml'
  push:
    branches:
      - main
      - jobfit-v2-build
    paths:
      - 'index.html'
      - 'v2/**'
      - 'instructor/**'
      - 'research-sync-config.js'
      - 'supabase/**'
      - 'docs/JOBFIT_DEVELOPMENT_RULES.md'
      - 'docs/JOBFIT_RELEASE_GATE.md'
      - '.github/workflows/jobfit-v2-check.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: jobfit-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          node --check v2/app.js
          node --check v2/research.js
          node --check v2/researchBackend.js
          node --check v2/researchMeasures.js
          node --check v2/careerDnaUx.js
          node --check instructor/app.js
          node --check instructor/centralBackend.js
          node --check instructor/researchData.js
          node --check research-sync-config.js
          node --check v2/tests/smoke.mjs
          node --check v2/tests/career-dna-regression.mjs
          node --check v2/tests/week-isolation-regression.mjs
          node --check v2/tests/live-production.mjs
          node --check v2/tests/research-measures.mjs
          node --check v2/tests/relationship-smoke.mjs
          node --check v2/tests/application-flow.mjs
          node --check v2/tests/backup-restore.mjs
          node --check v2/tests/inje-classroom.mjs
          for f in v2/steps/step*.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Confirm required modules, tests and assets
        shell: bash
        run: |
          set -e
          test -f index.html
          test -f v2/index.html
          test -f v2/styles.css
          test -f v2/guided.css
          test -f v2/portfolio.css
          test -f v2/careerDnaUx.js
          test -f v2/research.js
          test -f v2/researchMeasures.js
          test -f v2/researchBackend.js
          test -f instructor/index.html
          test -f instructor/app.js
          test -f instructor/researchData.js
          test -f instructor/centralBackend.js
          test -f instructor/styles.css
          test -f research-sync-config.js
          test -f supabase/research_schema.sql
          test -f supabase/config.toml
          test -f supabase/INSTRUCTOR_SETUP.md
          test -f supabase/functions/research-sync/index.ts
          test -f docs/JOBFIT_DEVELOPMENT_RULES.md
          test -f docs/JOBFIT_RELEASE_GATE.md
          test -f v2/tests/career-dna-regression.mjs
          test -f v2/tests/week-isolation-regression.mjs
          test -f v2/tests/live-production.mjs
          test -f v2/tests/research-measures.mjs
          test -f v2/tests/relationship-smoke.mjs
          test -f v2/tests/application-flow.mjs
          test -f v2/tests/backup-restore.mjs
          test -f v2/tests/inje-classroom.mjs
          for n in $(seq 0 13); do
            test -f "v2/steps/step${n}.js" || { echo "Missing step${n}.js"; exit 1; }
          done
      - name: Confirm both shells load required assets
        shell: bash
        run: |
          set -e
          grep -q './styles.css' v2/index.html
          grep -q './guided.css' v2/index.html
          grep -q './portfolio.css' v2/index.html
          grep -q './app.js' v2/index.html
          grep -q './careerDnaUx.js' v2/index.html
          grep -q './v2/styles.css' index.html
          grep -q './v2/guided.css' index.html
          grep -q './v2/portfolio.css' index.html
          grep -q './v2/app.js' index.html
          grep -q './v2/careerDnaUx.js' index.html
          grep -q 'importBtn' v2/index.html
          grep -q 'importBtn' index.html
      - name: Guard student submission while allowing restricted measure retrieval
        shell: bash
        run: |
          set -e
          grep -q 'enabled:false' research-sync-config.js
          grep -q 'instructorAuthEnabled:true' research-sync-config.js
          grep -q 'consentApproved:false' research-sync-config.js
          grep -q 'if(!consent)' v2/researchBackend.js
          grep -q 'RESEARCH_CONSENT_VERSION' supabase/functions/research-sync/index.ts
          grep -q 'revoke all on table public.research_snapshots from anon, authenticated' supabase/research_schema.sql
          grep -q 'excludes_activity_text' v2/researchBackend.js

          if grep -R -nE 'fetch\(|XMLHttpRequest|sendBeacon|supabase|firebase' v2/research.js v2/steps; then
            echo 'Unexpected network/research backend call found in learner steps or research export logic.'
            exit 1
          fi

          grep -q "MEASURE_FUNCTION_NAME='research-measures'" v2/researchMeasures.js
          grep -q 'functions/v1/${MEASURE_FUNCTION_NAME}' v2/researchMeasures.js
          if grep -nE 'XMLHttpRequest|sendBeacon|firebase|research-sync' v2/researchMeasures.js; then
            echo 'Unexpected submission/backend transport found in researchMeasures.js.'
            exit 1
          fi
          FETCH_COUNT=$(grep -c 'await fetch(' v2/researchMeasures.js || true)
          test "$FETCH_COUNT" -eq 1 || { echo "researchMeasures.js must contain exactly one authorized measure fetch; found $FETCH_COUNT"; exit 1; }

  browser-regression:
    needs: syntax-and-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/jobfit-server.log 2>&1 &
          echo $! >/tmp/jobfit-server.pid
          sleep 2
          curl --fail http://127.0.0.1:8765/ >/dev/null
          curl --fail http://127.0.0.1:8765/v2/ >/dev/null
      - name: Run v2 regression suite
        env:
          JOBFIT_TEST_URL: http://127.0.0.1:8765/v2/
        run: |
          node v2/tests/week-isolation-regression.mjs
          node v2/tests/career-dna-regression.mjs
          node v2/tests/research-measures.mjs
          node v2/tests/relationship-smoke.mjs
          node v2/tests/application-flow.mjs
          node v2/tests/backup-restore.mjs
      - name: Run production-root regression suite
        env:
          JOBFIT_TEST_URL: http://127.0.0.1:8765/
        run: |
          node v2/tests/week-isolation-regression.mjs
          node v2/tests/career-dna-regression.mjs
          node v2/tests/research-measures.mjs
          node v2/tests/relationship-smoke.mjs
          node v2/tests/application-flow.mjs
          node v2/tests/backup-restore.mjs
      - name: Show static server log on failure
        if: failure()
        run: cat /tmp/jobfit-server.log || true

  release-ready:
    if: github.event_name == 'push' && github.ref == 'refs/heads/jobfit-v2-build'
    needs:
      - syntax-and-contracts
      - browser-regression
    runs-on: ubuntu-latest
    steps:
      - name: Mark exact tested SHA ready for production
        run: |
          echo "Release-ready commit: ${GITHUB_SHA}"
          echo "Only this exact tested SHA may be promoted to main."

  live-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - syntax-and-contracts
      - browser-regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for GitHub Pages to deploy this exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          for attempt in $(seq 1 60); do
            RUNS=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=20")
            STATE=$(printf '%s' "$RUNS" | python3 -c "import json,sys; d=json.load(sys.stdin); r=[x for x in d.get('workflow_runs',[]) if x.get('name')=='pages build and deployment']; print((r[0].get('conclusion') or r[0].get('status')) if r else 'waiting')")
            echo "Pages deployment for ${GITHUB_SHA}: ${STATE} (attempt ${attempt}/60)"
            if [ "$STATE" = "success" ]; then exit 0; fi
            if [ "$STATE" = "failure" ] || [ "$STATE" = "cancelled" ] || [ "$STATE" = "timed_out" ] || [ "$STATE" = "action_required" ]; then exit 1; fi
            sleep 10
          done
          echo 'Timed out waiting for GitHub Pages deployment.'
          exit 1
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify deployed student Career DNA on desktop and mobile
        env:
          JOBFIT_LIVE_URL: https://kh31104.github.io/jobfit/?course=INJE2026
        run: node v2/tests/live-production.mjs

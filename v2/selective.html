<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jobfit Selective Career Tools</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./guided.css">
  <style>
    body{background:#f7f8fb}
    .selectiveShell{max-width:1180px;margin:0 auto;padding:24px 16px 56px}
    .selectiveTop{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
    .selectiveTop h1{margin:4px 0 6px;font-size:30px}
    .selectiveTop p{margin:0;color:#586174}
    .selectiveMeta{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .moduleGroup{margin-top:18px}
    .moduleGroup h3{margin:0 0 10px}
    .moduleGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
    .moduleCard{display:block;padding:16px;border:1px solid #dfe3ec;border-radius:16px;background:#fff;cursor:pointer;transition:.15s ease}
    .moduleCard:hover{transform:translateY(-1px)}
    .moduleCard.on{border-color:#315df4;box-shadow:0 0 0 2px rgba(49,93,244,.10)}
    .moduleCardTop{display:flex;gap:10px;align-items:flex-start}
    .moduleCard input{margin-top:4px;transform:scale(1.15)}
    .moduleCard h4{margin:0 0 5px;font-size:16px}
    .moduleCard p{margin:0;color:#667085;line-height:1.5;font-size:13px}
    .moduleTag{display:inline-flex;margin-top:9px;font-size:11px;font-weight:800;color:#536079;background:#f1f4f9;border-radius:999px;padding:4px 8px}
    .composerBar{position:sticky;bottom:12px;margin-top:18px;padding:16px;border-radius:18px;background:rgba(255,255,255,.96);border:1px solid #dfe3ec;box-shadow:0 14px 38px rgba(30,41,59,.12);backdrop-filter:blur(8px);z-index:4}
    .composerActions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .selectedSummary{margin:0 0 10px;color:#465166;font-size:13px}
    .generatedLink{margin-top:12px;padding:12px;border-radius:12px;background:#f7f8fb;word-break:break-all;font-size:13px}
    .standaloneNotice{margin:14px 0 18px}
    .selectiveFooter{margin-top:24px;color:#667085;font-size:13px;text-align:center}
    @media(max-width:640px){.selectiveTop{display:block}.selectiveMeta{justify-content:flex-start;margin-top:12px}.selectiveTop h1{font-size:25px}.composerBar{bottom:6px}}
  </style>
</head>
<body>
  <main class="selectiveShell">
    <header class="selectiveTop">
      <div>
        <div class="kicker">JOBFIT · SELECTIVE</div>
        <h1>선택형 Career Tools</h1>
        <p>강의 목적에 맞는 모듈만 골라 하나의 수업 링크로 조합합니다.</p>
      </div>
      <div class="selectiveMeta">
        <span class="badge">수업코드 불필요</span>
        <span class="badge">연구 제출 없음</span>
        <span class="badge">외부수업용</span>
      </div>
    </header>

    <div class="callout info standaloneNotice"><b>외부 강의·특강용 모듈 조합 화면입니다.</b><br>선택한 모듈은 Jobfit의 기본 학습 흐름 순서로 자동 배치됩니다. 학생 화면에는 학교별 수업 일정 정보가 표시되지 않습니다.</div>

    <section id="toolPicker" class="card"></section>
    <section id="toolRoot" hidden></section>
    <div class="selectiveFooter">Jobfit Selective Career Tools · 학생 입력은 각자의 브라우저에 저장됩니다.</div>
  </main>
  <script type="module" src="./selective-composer.js"></script>
  <script type="module" src="./selective.js"></script>
</body>
</html>
